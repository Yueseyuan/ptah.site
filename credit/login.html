<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Cruel & Associates Credit Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-page">
  <div class="form-card">
    <div class="form-logo">
      <a href="index.html">
        <div class="form-logo-main">Cruel & Associates</div>
        <div class="form-logo-sub">Credit Monitor</div>
      </a>
    </div>
    <h2 class="form-title">Welcome Back</h2>
    <p class="form-subtitle">Log in to view your credit dashboard.</p>

    <div id="error-msg" style="display:none;background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.25);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--red);margin-bottom:16px;">
      Invalid email or password. Please try again.
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password" style="display:flex;justify-content:space-between;">
          Password
          <a href="#" style="font-size:12px;color:var(--accent);font-weight:500;">Forgot password?</a>
        </label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg form-submit" id="submit-btn">
        Log In
      </button>
    </form>

    <div class="form-divider">or</div>

    <button class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="demoLogin()">
      Try Demo Dashboard
    </button>

    <div class="form-footer" style="margin-top:16px;">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const email = document.getElementById('email').value;
    const pass  = document.getElementById('password').value;

    btn.textContent = 'Logging in…';
    btn.disabled = true;

    setTimeout(() => {
      /* TODO: replace with real API call
         POST /api/auth/login */
      if (Auth.login(email, pass)) {
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
        btn.textContent = 'Log In';
        btn.disabled = false;
      }
    }, 1000);
  });

  function demoLogin() {
    Auth.login('demo@cruelandassociates.com', 'demo1234');
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
